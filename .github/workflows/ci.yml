name: CI

# Cloudflare Workers Builds owns DEPLOYMENT (git integration on the repo,
# `assets.directory: ./out` in wrangler.jsonc). This workflow deliberately
# does NOT deploy -- two deploy paths racing each other is how you get a
# site that disagrees with itself. CI's job is to fail a PR *before* the
# Cloudflare build fails, so a broken push shows up as a red check rather
# than a broken site.
#
# History: .github was deleted 2026-08-17 in the same commit that added
# wrangler.jsonc, during the AWS -> Cloudflare migration. The old deploy.yml
# pushed to S3 and invalidated CloudFront; that path is dead and is NOT
# restored here. Only the CI half comes back, plus two checks specific to
# how this repo actually breaks.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        run: npm run build

      # ---- repo-specific check 1: no fabricated or placeholder claims ----
      # This site's standard is that every claim must be defensible in an
      # interview. Template placeholders (USERNAME/REPO, XX.X%, example.com)
      # shipping to production is the exact failure this enforces against.
      # Also catches __TOKEN__ style markers from data-generation scripts
      # that did not substitute.
      - name: No placeholder or fabricated content
        run: |
          set -uo pipefail
          PATTERN='USERNAME/REPO|example\.com|XX\.X|X M\+|< X ms|PLACEHOLDER|__[A-Z][A-Z0-9_]+__|[Cc]oming soon|TODO: replace|lorem ipsum'
          if grep -rInE "$PATTERN" \
               --include='*.ts' --include='*.tsx' --include='*.md' \
               --include='*.mdx' --include='*.json' \
               src content 2>/dev/null; then
            echo
            echo "::error::Placeholder or template content found above."
            echo "Every claim on this site must be backed by a re-runnable source."
            exit 1
          fi
          echo "No placeholder content found."

      # ---- repo-specific check 1c: no em dashes ---------------------------
      # Em dashes are a well-known tell for LLM-generated prose. This site is
      # a job-hunt asset and the copy needs to read as written by a person.
      # Blocked at CI because re-introducing one is a single keystroke and
      # nobody proofreads a diff for punctuation.
      - name: No em dashes
        run: |
          set -uo pipefail
          if grep -rInP '\x{2014}' \
               --include='*.ts' --include='*.tsx' --include='*.md' \
               --include='*.mdx' --include='*.json' \
               src content 2>/dev/null; then
            echo
            echo "::error::Em dash (U+2014) found above. Use a comma, colon, period, or parentheses."
            exit 1
          fi
          echo "No em dashes found."

      # ---- repo-specific check 1d: every outbound link must resolve -------
      # A 404 on a project's repo link is worse than no link: it reads as a
      # fabricated reference on a page whose entire argument is "these
      # numbers are real, go check". GitHub rate-limits anonymous HTML, so
      # 429 is retried with backoff and never treated as dead.
      - name: Outbound links resolve
        run: |
          set -uo pipefail
          UA='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/122 Safari/537.36'
          grep -ohE '(github|demo): "https?://[^"]+"' src/data/projects.ts \
            | sed -E 's/.*"(https?:[^"]+)"/\1/' | sort -u > /tmp/urls.txt
          echo "checking $(wc -l < /tmp/urls.txt) urls"
          FAIL=0
          while read -r u; do
            [ -z "$u" ] && continue
            for attempt in 1 2 3; do
              code=$(curl -s -o /dev/null -w '%{http_code}' -A "$UA" \
                       --max-time 20 -L "$u" || echo 000)
              case "$code" in
                200) break ;;
                429) sleep $((attempt * 10)) ;;
                *)   sleep 3 ;;
              esac
            done
            if [ "$code" = 200 ]; then
              echo "  ok   $u"
            else
              echo "  DEAD $code $u"; FAIL=1
            fi
          done < /tmp/urls.txt
          [ $FAIL -eq 0 ] || { echo "::error::A project link does not resolve."; exit 1; }
      # ---- repo-specific check 1b: no KNOWN-STALE figures ----------------
      # The placeholder sweep above catches obvious template filler, but it
      # cannot catch a number that is merely OUT OF DATE -- "32 VMs" looks
      # exactly like a real measurement. That is how the homelab metric was
      # fixed in the metrics array while two copies survived in prose (one
      # of them on the resume) and shipped to production.
      #
      # This is a denylist of superseded values, not a live check. When a
      # figure is updated, add the old value here so it cannot come back.
      - name: No superseded figures
        run: |
          set -uo pipefail
          # each entry: 'regex|why'
          STALE=(
            '\b32 VMs\b|superseded: vCenter reports 46 powered on of 53'
            '~?607 GB|superseded: 608 GB total, 257 GB in use'
          )
          RC=0
          for entry in "${STALE[@]}"; do
            pat="${entry%%|*}"; why="${entry##*|}"
            if grep -rInE "$pat" --include='*.ts' --include='*.tsx' \
                 --include='*.md' --include='*.mdx' src content 2>/dev/null; then
              echo "::error::Stale figure matching /$pat/ -- $why"
              RC=1
            fi
          done
          [ "$RC" = 0 ] && echo "No superseded figures found."
          exit $RC

      # ---- repo-specific check 1e: blog integrity ------------------------
      # Two failure modes this catches:
      #   a) a published post with no body. The renderer falls back to
      #      `blogContent[slug] ?? []`, so a missing entry produces a page
      #      of chrome with nothing in it and still builds clean.
      #   b) placeholder identifiers in published prose. `myorg` and
      #      `my-app` in a code sample are the clearest possible signal
      #      that a post is generic tutorial content rather than
      #      first-hand experience, on a site whose whole argument is that
      #      its claims are checkable.
      - name: Blog posts have real content
        run: |
          set -uo pipefail
          node -e '
            const fs = require("fs");
            const blog = fs.readFileSync("src/data/blog.ts", "utf8");
            const content = fs.readFileSync("src/data/blog-content.ts", "utf8");

            // published slugs. The window must reach past any explanatory
            // comment between the slug and the published flag, but must not
            // run into the NEXT post, so it stops at the following slug.
            const live = [];
            const parts = blog.split(/slug:\s*"/).slice(1);
            for (const p of parts) {
              const slug = p.slice(0, p.indexOf("\""));
              const head = p.slice(0, p.indexOf("\n  },") + 1 || 1200);
              if (/published:\s*true/.test(head)) live.push(slug);
            }

            // slugs that have a content entry, with their block text
            const keyMatches = [...content.matchAll(/\n  "?([a-z0-9-]+)"?:\s*\[/g)];
            const keys = new Set(keyMatches.map(m => m[1]));
            const blocks = {};
            keyMatches.forEach((m, i) => {
              const start = m.index;
              const end = i + 1 < keyMatches.length ? keyMatches[i + 1].index : content.length;
              blocks[m[1]] = content.slice(start, end);
            });

            let fail = 0;
            for (const slug of live) {
              if (!keys.has(slug)) {
                console.log(`  EMPTY   ${slug} is published but has no content entry`);
                fail = 1;
              }
            }

            // Placeholders only matter in PUBLISHED prose. An unpublished
            // draft may legitimately still contain them; it is not on the
            // site. Scoping this to live posts is the difference between a
            // check that states the real rule and one that just nags.
            const placeholders = [/\bmyorg\b/i, /\bmy-app\b/i, /\byour-[a-z-]+\b/i,
                                  /example\.com/i, /CHANGEME/i, /\bTODO\b/];
            for (const slug of live) {
              const body = blocks[slug] || "";
              for (const re of placeholders) {
                const m = body.match(re);
                if (m) {
                  console.log(`  PLACEHOLDER ${m[0]} in published post ${slug}`);
                  fail = 1;
                }
              }
            }

            console.log(`  published posts: ${live.length}, content entries: ${keys.size}`);
            if (fail) {
              console.log("::error::Blog content check failed.");
              process.exit(1);
            }
            console.log("Blog content OK.");
          '

      # ---- repo-specific check 2: pages must RENDER, not merely build ----
      # A Next.js static export happily emits a page whose body is empty.
      # `next build` passing proves the bundle compiled, not that a visitor
      # sees anything. Assert every exported project page carries real prose.
      #
      # NOTE the path shape: `trailingSlash: true` means pages land at
      # out/projects/<slug>/index.html, NOT out/projects/<slug>.html.
      # (A verification script in this repo's history checked the wrong one
      # and reported every page as missing.)
      - name: Project pages render real content
        run: |
          set -uo pipefail
          FAIL=0
          COUNT=0
          for d in out/projects/*/; do
            slug=$(basename "$d")
            f="$d/index.html"
            [ -f "$f" ] || { echo "MISSING: $slug/index.html"; FAIL=1; continue; }
            words=$(sed 's/<[^>]*>/ /g' "$f" | tr -s ' \n' ' ' | wc -w)
            COUNT=$((COUNT+1))
            if [ "$words" -lt 150 ]; then
              echo "THIN ($words words): $slug"
              FAIL=1
            else
              echo "ok ($words words): $slug"
            fi
          done
          if [ "$COUNT" -lt 3 ]; then
            echo "::error::Only $COUNT project pages exported - expected the full set."
            exit 1
          fi
          [ "$FAIL" = 0 ] || { echo "::error::One or more project pages are missing or thin."; exit 1; }
          echo "All $COUNT project pages carry real content."

      # ---- the artifact Cloudflare will publish ----
      - name: Check the export is publishable
        run: |
          set -uo pipefail
          test -f out/index.html || { echo "::error::out/index.html missing"; exit 1; }
          echo "export size: $(du -sh out | cut -f1), $(find out -name '*.html' | wc -l) html files"
