name: Deploy (prod)

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_GHA_PORTFOLIO_DEPLOY }}
          aws-region: us-east-1

      - name: Sync to S3
        run: aws s3 sync out/ s3://porfolio-117370072143 --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id E13YN6JFDMLJA3 --paths "/*"
