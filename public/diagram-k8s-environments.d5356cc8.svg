<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 415" role="img" aria-label="Three Kubernetes environments"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1000" height="415" fill="#020617"/><text x="500" y="28" text-anchor="middle" fill="#e2e8f0" font-size="14">Three environments, one flat VLAN</text><text x="500" y="46" text-anchor="middle" fill="#64748b" font-size="9">identical build, different failure tolerance</text><rect x="60" y="70" width="280" height="58" rx="6" fill="#0f172a"/><rect x="60" y="70" width="280" height="58" rx="6" fill="rgba(34,211,238,0.13)" stroke="#22d3ee" stroke-width="1.5"/><text x="200.0" y="89" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">dev cluster</text><text x="200.0" y="103" text-anchor="middle" fill="#22d3ee" font-size="9">6 nodes · 55 pods</text><text x="200.0" y="115" text-anchor="middle" fill="#64748b" font-size="8">3 cp / 3 workers</text><rect x="100" y="160" width="200" height="50" rx="6" fill="#0f172a"/><rect x="100" y="160" width="200" height="50" rx="6" fill="rgba(34,211,238,0.13)" stroke="#22d3ee" stroke-width="1.5"/><text x="200.0" y="179" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">kube-vip (ARP)</text><text x="200.0" y="193" text-anchor="middle" fill="#22d3ee" font-size="9">virtual IP, one holder</text><text x="200.0" y="205" text-anchor="middle" fill="#64748b" font-size="8">failover measured ~3s</text><line x1="200" y1="128" x2="200" y2="158" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#a)"/><rect x="100" y="240" width="200" height="50" rx="6" fill="#0f172a"/><rect x="100" y="240" width="200" height="50" rx="6" fill="rgba(34,211,238,0.13)" stroke="#22d3ee" stroke-width="1.5"/><text x="200.0" y="259" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">etcd</text><text x="200.0" y="273" text-anchor="middle" fill="#22d3ee" font-size="9">fsync p99 10.52 ms</text><text x="200.0" y="285" text-anchor="middle" fill="#64748b" font-size="8">budget 25 ms</text><line x1="200" y1="210" x2="200" y2="238" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#a)"/><rect x="360" y="70" width="280" height="58" rx="6" fill="#0f172a"/><rect x="360" y="70" width="280" height="58" rx="6" fill="rgba(251,191,36,0.13)" stroke="#fbbf24" stroke-width="1.5"/><text x="500.0" y="89" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">staging cluster</text><text x="500.0" y="103" text-anchor="middle" fill="#fbbf24" font-size="9">3 nodes · 36 pods</text><text x="500.0" y="115" text-anchor="middle" fill="#64748b" font-size="8">1 etcd member</text><rect x="400" y="160" width="200" height="50" rx="6" fill="#0f172a"/><rect x="400" y="160" width="200" height="50" rx="6" fill="rgba(251,191,36,0.13)" stroke="#fbbf24" stroke-width="1.5"/><text x="500.0" y="179" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">kube-vip (ARP)</text><text x="500.0" y="193" text-anchor="middle" fill="#fbbf24" font-size="9">virtual IP, one holder</text><text x="500.0" y="205" text-anchor="middle" fill="#64748b" font-size="8">failover measured ~3s</text><line x1="500" y1="128" x2="500" y2="158" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#a)"/><rect x="400" y="240" width="200" height="50" rx="6" fill="#0f172a"/><rect x="400" y="240" width="200" height="50" rx="6" fill="rgba(251,191,36,0.13)" stroke="#fbbf24" stroke-width="1.5"/><text x="500.0" y="259" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">etcd</text><text x="500.0" y="273" text-anchor="middle" fill="#fbbf24" font-size="9">fsync p99 9.07 ms</text><text x="500.0" y="285" text-anchor="middle" fill="#64748b" font-size="8">budget 25 ms</text><line x1="500" y1="210" x2="500" y2="238" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#a)"/><rect x="660" y="70" width="280" height="58" rx="6" fill="#0f172a"/><rect x="660" y="70" width="280" height="58" rx="6" fill="rgba(52,211,153,0.13)" stroke="#34d399" stroke-width="1.5"/><text x="800.0" y="89" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">production cluster</text><text x="800.0" y="103" text-anchor="middle" fill="#34d399" font-size="9">6 nodes · 55 pods</text><text x="800.0" y="115" text-anchor="middle" fill="#64748b" font-size="8">3 etcd members</text><rect x="700" y="160" width="200" height="50" rx="6" fill="#0f172a"/><rect x="700" y="160" width="200" height="50" rx="6" fill="rgba(52,211,153,0.13)" stroke="#34d399" stroke-width="1.5"/><text x="800.0" y="179" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">kube-vip (ARP)</text><text x="800.0" y="193" text-anchor="middle" fill="#34d399" font-size="9">virtual IP, one holder</text><text x="800.0" y="205" text-anchor="middle" fill="#64748b" font-size="8">failover measured ~3s</text><line x1="800" y1="128" x2="800" y2="158" stroke="#34d399" stroke-width="1.5" marker-end="url(#a)"/><rect x="700" y="240" width="200" height="50" rx="6" fill="#0f172a"/><rect x="700" y="240" width="200" height="50" rx="6" fill="rgba(52,211,153,0.13)" stroke="#34d399" stroke-width="1.5"/><text x="800.0" y="259" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">etcd</text><text x="800.0" y="273" text-anchor="middle" fill="#34d399" font-size="9">fsync p99 10.96 ms</text><text x="800.0" y="285" text-anchor="middle" fill="#64748b" font-size="8">budget 25 ms</text><line x1="800" y1="210" x2="800" y2="238" stroke="#34d399" stroke-width="1.5" marker-end="url(#a)"/><rect x="60" y="320" width="880" height="44" rx="6" fill="#0f172a" stroke="#fb7185" stroke-width="1.5"/><text x="500" y="338" text-anchor="middle" fill="#fb7185" font-size="10">All three clusters share VLAN 110. There is no network isolation between environments.</text><text x="500" y="353" text-anchor="middle" fill="#64748b" font-size="8">Only one VLAN is trunked to these hosts, so this is a known limitation, not an oversight.</text><text x="500" y="392" text-anchor="middle" fill="#64748b" font-size="9">Staging holds a single etcd member on purpose: it is a preview environment, not a resilience claim.</text></svg>