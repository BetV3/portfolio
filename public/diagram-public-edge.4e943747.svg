<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="Public edge via outbound tunnel"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1000" height="380" fill="#020617"/><text x="500" y="28" text-anchor="middle" fill="#e2e8f0" font-size="14">Public without inbound ports</text><text x="500" y="46" text-anchor="middle" fill="#64748b" font-size="9">every connection is outbound; the firewall has no forwarded port</text><rect x="60" y="90" width="180" height="56" rx="6" fill="#0f172a"/><rect x="60" y="90" width="180" height="56" rx="6" fill="rgba(167,139,250,0.13)" stroke="#a78bfa" stroke-width="1.5"/><text x="150.0" y="109" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">visitor</text><text x="150.0" y="123" text-anchor="middle" fill="#a78bfa" font-size="9">https</text><line x1="240" y1="118" x2="330" y2="118" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#a)"/><rect x="330" y="90" width="200" height="56" rx="6" fill="#0f172a"/><rect x="330" y="90" width="200" height="56" rx="6" fill="rgba(167,139,250,0.13)" stroke="#a78bfa" stroke-width="1.5"/><text x="430.0" y="109" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Cloudflare edge</text><text x="430.0" y="123" text-anchor="middle" fill="#a78bfa" font-size="9">TLS terminates here</text><text x="430.0" y="135" text-anchor="middle" fill="#64748b" font-size="8">public cert</text><rect x="640" y="90" width="250" height="70" rx="6" fill="#0f172a"/><rect x="640" y="90" width="250" height="70" rx="6" fill="rgba(52,211,153,0.13)" stroke="#34d399" stroke-width="1.5"/><text x="765.0" y="109" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">cloudflared connector</text><text x="765.0" y="123" text-anchor="middle" fill="#34d399" font-size="9">runs inside the cluster</text><text x="765.0" y="135" text-anchor="middle" fill="#64748b" font-size="8">dials out to Cloudflare</text><line x1="640" y1="125" x2="535" y2="118" stroke="#34d399" stroke-width="1.5" marker-end="url(#a)"/><text x="590" y="108" text-anchor="middle" fill="#34d399" font-size="8">outbound</text><text x="590" y="145" text-anchor="middle" fill="#64748b" font-size="8">QUIC, 4 connections</text><line x1="765" y1="160" x2="765" y2="200" stroke="#34d399" stroke-width="1.5" marker-end="url(#a)"/><rect x="640" y="202" width="250" height="56" rx="6" fill="#0f172a"/><rect x="640" y="202" width="250" height="56" rx="6" fill="rgba(52,211,153,0.13)" stroke="#34d399" stroke-width="1.5"/><text x="765.0" y="221" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">ingress-nginx</text><text x="765.0" y="235" text-anchor="middle" fill="#34d399" font-size="9">NodePort 30080/30443</text><text x="765.0" y="247" text-anchor="middle" fill="#64748b" font-size="8">no cloud load balancer</text><line x1="765" y1="258" x2="765" y2="296" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><rect x="640" y="298" width="250" height="56" rx="6" fill="#0f172a"/><rect x="640" y="298" width="250" height="56" rx="6" fill="rgba(52,211,153,0.13)" stroke="#34d399" stroke-width="1.5"/><text x="765.0" y="317" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">workload pods</text><rect x="60" y="200" width="520" height="70" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/><text x="320" y="222" text-anchor="middle" fill="#e2e8f0" font-size="11">Home firewall</text><text x="320" y="240" text-anchor="middle" fill="#64748b" font-size="9">zero forwarded ports · no DMZ · no public IP on any host</text><text x="320" y="257" text-anchor="middle" fill="#64748b" font-size="8">the home address is never published in DNS</text><rect x="60" y="300" width="520" height="54" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/><text x="320" y="320" text-anchor="middle" fill="#fbbf24" font-size="11">First success was a 404.</text><text x="320" y="338" text-anchor="middle" fill="#64748b" font-size="8">nginx answering with no rules proved the whole path worked before any app existed.</text></svg>