<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" role="img" aria-label="Observability and alerting"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs><rect width="1000" height="490" fill="#020617"/><text x="500" y="28" text-anchor="middle" fill="#e2e8f0" font-size="14">Two systems, one job each</text><text x="500" y="46" text-anchor="middle" fill="#64748b" font-size="9">observability explains why; the watchdog decides whether to wake you</text><rect x="60" y="75" width="150" height="40" rx="6" fill="#0f172a"/><rect x="60" y="75" width="150" height="40" rx="6" fill="rgba(34,211,238,0.13)" stroke="#22d3ee" stroke-width="1.5"/><text x="135.0" y="94" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">3 k8s clusters</text><line x1="135" y1="115" x2="420" y2="160" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#a)"/><rect x="235" y="75" width="150" height="40" rx="6" fill="#0f172a"/><rect x="235" y="75" width="150" height="40" rx="6" fill="rgba(34,211,238,0.13)" stroke="#22d3ee" stroke-width="1.5"/><text x="310.0" y="94" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">24 node_exporters</text><line x1="310" y1="115" x2="420" y2="160" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#a)"/><rect x="410" y="75" width="150" height="40" rx="6" fill="#0f172a"/><rect x="410" y="75" width="150" height="40" rx="6" fill="rgba(34,211,238,0.13)" stroke="#22d3ee" stroke-width="1.5"/><text x="485.0" y="94" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">vCenter</text><line x1="485" y1="115" x2="420" y2="160" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#a)"/><rect x="560" y="75" width="150" height="40" rx="6" fill="#0f172a"/><rect x="560" y="75" width="150" height="40" rx="6" fill="rgba(34,211,238,0.13)" stroke="#22d3ee" stroke-width="1.5"/><text x="635.0" y="94" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">blackbox probes</text><line x1="635" y1="115" x2="420" y2="160" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#a)"/><rect x="330" y="165" width="190" height="56" rx="6" fill="#0f172a"/><rect x="330" y="165" width="190" height="56" rx="6" fill="rgba(34,211,238,0.13)" stroke="#22d3ee" stroke-width="1.5"/><text x="425.0" y="184" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">vmagent</text><text x="425.0" y="198" text-anchor="middle" fill="#22d3ee" font-size="9">persistent queue</text><text x="425.0" y="210" text-anchor="middle" fill="#64748b" font-size="8">survived a 100s outage, 0 loss</text><line x1="425" y1="221" x2="425" y2="255" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><rect x="330" y="258" width="190" height="56" rx="6" fill="#0f172a"/><rect x="330" y="258" width="190" height="56" rx="6" fill="rgba(34,211,238,0.13)" stroke="#22d3ee" stroke-width="1.5"/><text x="425.0" y="277" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">VictoriaMetrics</text><text x="425.0" y="291" text-anchor="middle" fill="#22d3ee" font-size="9">77 targets up</text><text x="425.0" y="303" text-anchor="middle" fill="#64748b" font-size="8">26339915 rows/hour</text><line x1="425" y1="314" x2="425" y2="348" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/><rect x="330" y="350" width="190" height="50" rx="6" fill="#0f172a"/><rect x="330" y="350" width="190" height="50" rx="6" fill="rgba(34,211,238,0.13)" stroke="#22d3ee" stroke-width="1.5"/><text x="425.0" y="369" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Grafana</text><text x="425.0" y="383" text-anchor="middle" fill="#22d3ee" font-size="9">HTTPS, internal CA</text><text x="425.0" y="395" text-anchor="middle" fill="#64748b" font-size="8">diagnosis only</text><rect x="680" y="165" width="230" height="70" rx="6" fill="#0f172a"/><rect x="680" y="165" width="230" height="70" rx="6" fill="rgba(251,191,36,0.13)" stroke="#fbbf24" stroke-width="1.5"/><text x="795.0" y="184" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">watchdog.py</text><text x="795.0" y="198" text-anchor="middle" fill="#fbbf24" font-size="9">89 signals</text><text x="795.0" y="210" text-anchor="middle" fill="#64748b" font-size="8">system cron, OUTSIDE the scheduler</text><rect x="680" y="265" width="230" height="50" rx="6" fill="#0f172a"/><rect x="680" y="265" width="230" height="50" rx="6" fill="rgba(251,191,36,0.13)" stroke="#fbbf24" stroke-width="1.5"/><text x="795.0" y="284" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600">Discord alert</text><text x="795.0" y="298" text-anchor="middle" fill="#fbbf24" font-size="9">the only alert path</text><line x1="795" y1="235" x2="795" y2="263" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#a)"/><line x1="600" y1="150" x2="600" y2="420" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4 4"/><text x="600" y="143" text-anchor="middle" fill="#64748b" font-size="8">no link between these two</text><rect x="60" y="420" width="880" height="46" rx="6" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/><text x="500" y="439" text-anchor="middle" fill="#fbbf24" font-size="10">There is no Alertmanager, on purpose. Two alerting systems means two places to miss an outage.</text><text x="500" y="455" text-anchor="middle" fill="#64748b" font-size="8">If a metric deserves paging, it becomes a watchdog signal instead.</text></svg>